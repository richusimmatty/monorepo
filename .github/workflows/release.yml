name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Get the version from tag
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Build and push Docker images with version tag
      - name: Build and Push Docker Images
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Build affected projects
          npx nx affected -t build
          
          # Build and push Docker images for affected projects
          for app in $(npx nx show projects --affected); do
            if [ -f "apps/$app/Dockerfile" ]; then
              echo "Building and pushing $app with version $VERSION"
              docker build -f apps/$app/Dockerfile \
                -t ${DOCKER_USERNAME}/$app:${VERSION} \
                -t ${DOCKER_USERNAME}/$app:latest \
                -t ${DOCKER_USERNAME}/$app:${GIT_SHA} .
              docker push ${DOCKER_USERNAME}/$app:${VERSION}
              docker push ${DOCKER_USERNAME}/$app:latest
              docker push ${DOCKER_USERNAME}/$app:${GIT_SHA}
            fi
          done

      # Generate changelog
      - name: Generate Changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Get affected projects
          AFFECTED=$(npx nx show projects --affected | tr '\n' ', ' | sed 's/,$//')
          
          # Create changelog content
          cat > release_notes.md << EOF
          ## What's Changed
          
          ${COMMITS}
          
          ## Affected Projects
          ${AFFECTED}
          
          ## Docker Images
          EOF
          
          # Add Docker image tags for affected projects
          for app in $(npx nx show projects --affected); do
            if [ -f "apps/$app/Dockerfile" ]; then
              echo "- \`${DOCKER_USERNAME}/$app:${{ steps.version.outputs.VERSION }}\`" >> release_notes.md
              echo "- \`${DOCKER_USERNAME}/$app:latest\`" >> release_notes.md
            fi
          done
          
          # Update CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepend new release to CHANGELOG.md
          {
            head -n 2 CHANGELOG.md
            echo ""
            echo "## [${{ steps.version.outputs.VERSION }}] - $(date +%Y-%m-%d)"
            echo ""
            cat release_notes.md
            echo ""
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # Commit updated CHANGELOG.md
      - name: Commit CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Nothing to push"

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
