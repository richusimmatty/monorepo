name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Run typechecking
      - run: npx nx run-many -t typecheck

      # Run builds
      - run: npx nx run-many -t build

      # Login to GitHub Container Registry (only on push to main)
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker images for affected projects
      - name: Build and Push Docker Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
        run: npx nx affected -t docker-build

      # Build Docker images for PRs (without push)
      - name: Build Docker Images (PR)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t docker-build
