name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Run typechecking
      - run: npx nx run-many -t typecheck

      # Run builds
      - run: npx nx run-many -t build

      # Login to Docker Hub (only on push to main)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker images for affected projects
      - name: Build and Push Docker Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        run: npx nx affected -t docker-build

      # Build Docker images for PRs (without push)
      - name: Build Docker Images (PR)
        if: github.event_name == 'pull_request'
        run: npx nx affected -t docker-build

      # Update CHANGELOG.md on push to main
      - name: Update CHANGELOG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Get the last commit message and hash
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          COMMIT_DATE=$(date +%Y-%m-%d)
          
          # Get affected projects
          AFFECTED=$(npx nx show projects --affected | tr '\n' ', ' | sed 's/,$//')
          
          # Create CHANGELOG.md if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepare the new entry
          NEW_ENTRY="## [$COMMIT_DATE] - Commit $COMMIT_HASH\n\n### Changes\n- $COMMIT_MSG\n\n### Affected Projects\n$AFFECTED\n\n### Docker Images\n"
          
          # Add Docker image tags for affected projects
          for app in $(npx nx show projects --affected); do
            if [ -f "apps/$app/Dockerfile" ]; then
              NEW_ENTRY="${NEW_ENTRY}- \`${{ secrets.DOCKERHUB_USERNAME }}/$app:$COMMIT_HASH\`\n"
              NEW_ENTRY="${NEW_ENTRY}- \`${{ secrets.DOCKERHUB_USERNAME }}/$app:latest\`\n"
            fi
          done
          
          # Insert new entry after the header
          {
            head -n 2 CHANGELOG.md
            echo ""
            echo -e "$NEW_ENTRY"
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # Commit and push CHANGELOG
      - name: Commit CHANGELOG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: Update CHANGELOG [skip ci]"
          git push || echo "Nothing to push"

